# Zero-cost, staging-only topology. Four Free web services and one Free Postgres.
# Free web services are public; application JWT/service-key checks and local rate limits
# protect direct service URLs. Service-to-service requests use HTTPS hostnames.
projects:
  - name: equa-staging-demo
    environments:
      - name: staging
        services:
          - type: web
            name: equa-staging-demo-gateway
            runtime: docker
            plan: free
            region: singapore
            branch: staging/demo
            autoDeployTrigger: checksPass
            dockerfilePath: ./infra/docker/kong-staging.Dockerfile
            dockerContext: .
            envVars:
              - key: WEB_ORIGIN
                sync: false
              - key: IDENTITY_EXTERNAL_HOSTNAME
                fromService:
                  type: web
                  name: equa-staging-demo-identity
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: SOCIAL_EXTERNAL_HOSTNAME
                fromService:
                  type: web
                  name: equa-staging-demo-social
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: LEDGER_EXTERNAL_HOSTNAME
                fromService:
                  type: web
                  name: equa-staging-demo-ledger
                  envVarKey: RENDER_EXTERNAL_HOSTNAME

          - type: web
            name: equa-staging-demo-identity
            runtime: node
            plan: free
            region: singapore
            branch: staging/demo
            rootDir: .
            autoDeployTrigger: checksPass
            healthCheckPath: /health
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @equa/identity-service... build
            startCommand: pnpm --filter @equa/identity-service db:migrate && pnpm --filter @equa/identity-service start
            envVars:
              - fromGroup: equa-staging-runtime
              - fromGroup: equa-staging-jwt
              - fromGroup: equa-staging-identity-key
              - key: APP_WEB_URL
                sync: false
              - key: IDENTITY_DATABASE_URL
                fromDatabase:
                  name: equa-staging-demo-postgres
                  property: connectionString
              - key: EMAIL_PROVIDER
                value: resend
              - key: EMAIL_FROM
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: AVATAR_STORAGE_ENABLED
                value: 'false'

          - type: web
            name: equa-staging-demo-social
            runtime: node
            plan: free
            region: singapore
            branch: staging/demo
            rootDir: .
            autoDeployTrigger: checksPass
            healthCheckPath: /health
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @equa/social-service... build
            startCommand: |
              set -eu
              export IDENTITY_URL="https://${IDENTITY_EXTERNAL_HOSTNAME}"
              export LEDGER_URL="https://${LEDGER_EXTERNAL_HOSTNAME}"
              pnpm --filter @equa/social-service db:migrate
              exec pnpm --filter @equa/social-service start
            envVars:
              - fromGroup: equa-staging-runtime
              - fromGroup: equa-staging-jwt
              - fromGroup: equa-staging-identity-key
              - fromGroup: equa-staging-social-ledger-key
              - fromGroup: equa-staging-ledger-social-key
              - key: APP_WEB_URL
                sync: false
              - key: SOCIAL_DATABASE_URL
                fromDatabase:
                  name: equa-staging-demo-postgres
                  property: connectionString
              - key: IDENTITY_EXTERNAL_HOSTNAME
                fromService:
                  type: web
                  name: equa-staging-demo-identity
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: LEDGER_EXTERNAL_HOSTNAME
                fromService:
                  type: web
                  name: equa-staging-demo-ledger
                  envVarKey: RENDER_EXTERNAL_HOSTNAME

          - type: web
            name: equa-staging-demo-ledger
            runtime: node
            plan: free
            region: singapore
            branch: staging/demo
            rootDir: .
            autoDeployTrigger: checksPass
            healthCheckPath: /health
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @equa/ledger-service... build
            startCommand: |
              set -eu
              export SOCIAL_URL="https://${SOCIAL_EXTERNAL_HOSTNAME}"
              pnpm --filter @equa/ledger-service migrate
              exec pnpm --filter @equa/ledger-service start
            envVars:
              - fromGroup: equa-staging-runtime
              - fromGroup: equa-staging-jwt
              - fromGroup: equa-staging-social-ledger-key
              - fromGroup: equa-staging-ledger-social-key
              - fromGroup: equa-staging-feed-key
              - key: LEDGER_DATABASE_URL
                fromDatabase:
                  name: equa-staging-demo-postgres
                  property: connectionString
              - key: SOCIAL_EXTERNAL_HOSTNAME
                fromService:
                  type: web
                  name: equa-staging-demo-social
                  envVarKey: RENDER_EXTERNAL_HOSTNAME

        databases:
          - name: equa-staging-demo-postgres
            databaseName: equa_identity
            user: equa_staging_owner
            postgresMajorVersion: '18'
            plan: free
            region: singapore
            ipAllowList: []

        envVarGroups:
          - name: equa-staging-runtime
            envVars:
              - key: NODE_ENV
                value: production
              - key: IDENTITY_JWT_ISSUER
                value: equa-identity
              - key: IDENTITY_JWT_AUDIENCE
                value: equa-clients
          - name: equa-staging-jwt
            envVars:
              - key: IDENTITY_JWT_SECRET
                generateValue: true
          - name: equa-staging-identity-key
            envVars:
              - key: IDENTITY_SERVICE_KEY
                generateValue: true
          - name: equa-staging-social-ledger-key
            envVars:
              - key: SOCIAL_SERVICE_KEY
                generateValue: true
          - name: equa-staging-ledger-social-key
            envVars:
              - key: LEDGER_SERVICE_KEY
                generateValue: true
          - name: equa-staging-feed-key
            envVars:
              - key: LEDGER_FEED_CURSOR_SECRET
                generateValue: true
