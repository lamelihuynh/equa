_format_version: '3.0'
_transform: true

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true

  - name: cors
    config:
      origins:
        - ${WEB_ORIGIN}
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Idempotency-Key
        - X-Correlation-ID
      exposed_headers:
        - X-Correlation-ID
      credentials: true
      max_age: 3600

  - name: request-size-limiting
    config:
      allowed_payload_size: 5
      size_unit: megabytes

  - name: rate-limiting
    config:
      minute: 300
      policy: local

services:
  - name: identity-service
    url: https://${IDENTITY_EXTERNAL_HOSTNAME}
    routes:
      - name: identity-routes
        paths:
          - /health
          - /v1/auth
          - /v1/profile
          - /v1/docs
        strip_path: false

  - name: social-service
    url: https://${SOCIAL_EXTERNAL_HOSTNAME}
    routes:
      - name: social-routes
        paths:
          - /v1/friends
          - /v1/groups
        strip_path: false

  - name: ledger-service
    url: https://${LEDGER_EXTERNAL_HOSTNAME}
    routes:
      - name: ledger-routes
        paths:
          - /v1/expenses
          - /v1/categories
        strip_path: false

  - name: automation-sync-service
    url: https://${AUTOMATION_EXTERNAL_HOSTNAME}
    routes:
      - name: automation-sync-routes
        paths:
          - /v1/sync
          - /v1/recurring
        strip_path: false
