name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
      any: ${{ steps.affected.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: affected
        name: Detect affected packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          matrix=$(node scripts/ci/affected-components.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --mode quality)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then echo 'any=false' >> "$GITHUB_OUTPUT"; else echo 'any=true' >> "$GITHUB_OUTPUT"; fi

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:scaffold
      - run: node --test scripts/ci/affected-components.test.mjs
      - run: docker compose --env-file .env.example -f infra/compose/docker-compose.yml config --quiet

  component:
    name: ${{ matrix.id }} quality
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/component-quality.yml
    with:
      component_id: ${{ matrix.id }}
      package_name: ${{ matrix.package }}
      component_path: ${{ matrix.path }}

  compose:
    name: Infrastructure smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose rendering
        run: docker compose --env-file .env.example -f infra/compose/docker-compose.yml config --quiet
      - name: Start core infrastructure
        run: docker compose --env-file .env.example -f infra/compose/docker-compose.yml up -d --wait postgres redis rabbitmq kong
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose --env-file .env.example -f infra/compose/docker-compose.yml ps && docker compose --env-file .env.example -f infra/compose/docker-compose.yml logs --tail=200
      - name: Stop infrastructure
        if: always()
        run: docker compose --env-file .env.example -f infra/compose/docker-compose.yml down -v
