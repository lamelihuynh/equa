name: Deploy staging

on:
  push:
    branches: ['**']

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    if: github.ref == format('refs/heads/{0}', vars.STAGING_BRANCH || 'develop')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
      any: ${{ steps.affected.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: affected
        name: Detect affected staging components
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          matrix=$(node scripts/ci/affected-components.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --mode staging)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then echo 'any=false' >> "$GITHUB_OUTPUT"; else echo 'any=true' >> "$GITHUB_OUTPUT"; fi

  quality:
    name: ${{ matrix.id }} staging quality
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/component-quality.yml
    with:
      component_id: ${{ matrix.id }}
      package_name: ${{ matrix.package }}
      component_path: ${{ matrix.path }}

  deploy:
    name: ${{ matrix.id }} staging deploy
    needs: [detect, quality]
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: PACKAGE_NAME=${{ matrix.package }}
          tags: ghcr.io/${{ github.repository_owner }}/equa-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,scope=${{ matrix.id }},mode=max
      - name: Trigger component deploy
        env:
          DEPLOY_HOOK: ${{ secrets[matrix.hookSecret] }}
          IMAGE_URL: ghcr.io/${{ github.repository_owner }}/equa-${{ matrix.image }}:sha-${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST --get --data-urlencode "imgURL=$IMAGE_URL" "$DEPLOY_HOOK"
      - name: HTTP smoke check when configured
        if: matrix.smokeKind == 'http'
        env:
          SMOKE_BASE_URL: ${{ vars[matrix.smokeUrlVar] }}
          SMOKE_PATH: ${{ matrix.smokePath }}
        run: |
          test -n "$SMOKE_BASE_URL"
          curl --fail --silent --show-error "${SMOKE_BASE_URL%/}$SMOKE_PATH"
