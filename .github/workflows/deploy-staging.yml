name: Deploy staging

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-identity
  cancel-in-progress: true

jobs:
  verify-build-deploy-identity:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.21.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @equa/identity-service lint
      - run: pnpm --filter @equa/identity-service typecheck
      - run: pnpm --filter @equa/identity-service test:coverage
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node-service.Dockerfile
          push: true
          build-args: PACKAGE_NAME=@equa/identity-service
          tags: ghcr.io/${{ github.repository_owner }}/equa-identity:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_IDENTITY_DEPLOY_HOOK }}
          IMAGE_URL: ghcr.io/${{ github.repository_owner }}/equa-identity:sha-${{ github.sha }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST --get --data-urlencode "imgURL=$IMAGE_URL" "$RENDER_DEPLOY_HOOK"
      - name: Staging smoke test through Kong
        env:
          STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          test -n "$STAGING_API_BASE_URL"
          curl --fail --silent --show-error "$STAGING_API_BASE_URL/health"
