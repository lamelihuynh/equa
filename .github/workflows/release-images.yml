name: Release container images

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: identity
            package: '@equa/identity-service'
            dockerfile: infra/docker/node-service.Dockerfile
          - image: ledger
            package: '@equa/ledger-service'
            dockerfile: infra/docker/node-service.Dockerfile
          - image: platform
            package: '@equa/platform-service'
            dockerfile: infra/docker/node-service.Dockerfile
          - image: notification
            package: '@equa/notification-worker'
            dockerfile: infra/docker/node-service.Dockerfile
          - image: web
            package: '@equa/web'
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/equa-${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: PACKAGE_NAME=${{ matrix.package }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
